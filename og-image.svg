  <text x="72" y="460" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" fill="#0D1117" letter-spacing="-1">Satış otomasyonu, somut büyüme.</text>
  <text x="72" y="498" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#6A7280">14 gün ücretsiz demo · Taahhüt yok</text>
  <!-- CTA pill -->
  <rect x="72" y="528" width="220" height="44" rx="10" fill="#1355FF"/>
  <text x="182" y="556" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">callypsotech.com</text>
  <!-- Contact -->
  <text x="314" y="556" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#98A0AB">support@callypsotech.com · İstanbul, Türkiye</text>
