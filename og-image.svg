<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E3E1DB"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#F6F5F2"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.7"/>
  <!-- Top accent bar -->
  <rect width="1200" height="5" fill="#1355FF"/>
  <!-- Logo -->
  <text x="72" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="54" font-weight="800" fill="#0D1117" letter-spacing="-2">Callypso<tspan fill="#1355FF">Tech</tspan></text>
  <!-- Tagline -->
  <text x="72" y="168" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6A7280">İstanbul · B2B Satış ve Büyüme Otomasyonu</text>
  <!-- Divider -->
  <rect x="72" y="196" width="1056" height="1" fill="#E3E1DB"/>
  <!-- Product: Callypso Engage -->
  <rect x="72" y="224" width="490" height="168" rx="14" fill="#FFFFFF" stroke="#E3E1DB" stroke-width="1.5"/>
  <rect x="72" y="224" width="490" height="5" rx="2" fill="#1355FF"/>
  <text x="104" y="276" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0D1117">Callypso Engage</text>
  <text x="104" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" fill="#6A7280">E-ticaret büyüme otomasyonu</text>
  <text x="104" y="332" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· Sepet terk geri kazanımı</text>
  <text x="104" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· WhatsApp, SMS ve E-posta akışları</text>
  <text x="104" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· Shopify, ikas, Ticimax entegrasyonu</text>
  <!-- Product: OmniExport -->
  <rect x="638" y="224" width="490" height="168" rx="14" fill="#FFFFFF" stroke="#E3E1DB" stroke-width="1.5"/>
  <rect x="638" y="224" width="490" height="5" rx="2" fill="#0A6E4A"/>
  <text x="670" y="276" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0D1117">OmniExport</text>
  <text x="670" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="13.5" fill="#6A7280">İhracat satış otomasyonu</text>
  <text x="670" y="332" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· AI destekli yurt dışı müşteri araştırması</text>
  <text x="670" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· Kişiselleştirilmiş ilk temas hazırlığı</text>
  <text x="670" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#374151">· Avrupa, Orta Doğu, Küresel pazarlar</text>
